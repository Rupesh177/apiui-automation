server:
  port: 8081

spring:
  application:
    name: test-data-service

  datasource:
    url: jdbc:mysql://mysql:3306/test
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: kafka:9092

logging:
  level:
    root: INFO
    org.springframework.jdbc.core: INFO
    org.flywaydb: INFO