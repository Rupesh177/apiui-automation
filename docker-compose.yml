version: "3.8"

services:

  # -------------------------------
  # SELENIUM GRID HUB
  # -------------------------------
  selenium-hub:
    image: selenium/hub:4.21
    container_name: selenium-hub
    ports:
      - "4444:4444"

  # -------------------------------
  # CHROME NODE
  # -------------------------------
  chrome-node:
    image: selenium/node-chrome:4.21
    container_name: chrome-node
    depends_on:
      - selenium-hub
    shm_size: "2gb"
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443

  # -------------------------------
  # HEALENIUM DB (POSTGRES)
  # -------------------------------
  hlm-postgres:
    image: postgres:15
    container_name: hlm-postgres
    environment:
      POSTGRES_DB: healenium
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  # -------------------------------
  # HEALENIUM BACKEND
  # -------------------------------
  healenium:
    image: healenium/hlm-backend:3.5.6
    container_name: healenium
    depends_on:
      - hlm-postgres
    ports:
      - "7878:7878"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://hlm-postgres:5432/healenium
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres

  # -------------------------------
  # TEST DATA SERVICE
  # -------------------------------
  test-data:
    build: ./test-data-service
    container_name: test-data-service
    ports:
      - "8081:8081"

  # -------------------------------
  # PROMETHEUS
  # -------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"

  # -------------------------------
  # GRAFANA
  # -------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # -------------------------------
  # VAULT
  # -------------------------------
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: my-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: vault server -dev

  # -------------------------------
  # VAULT INIT
  # -------------------------------
  vault-init:
    image: hashicorp/vault:latest
    container_name: vault-init
    depends_on:
      - vault
    volumes:
      - ./docker/vault/init-vault.sh:/init-vault.sh
    entrypoint: ["/bin/sh", "/init-vault.sh"]

  # -------------------------------
  # TEST RUNNER
  # -------------------------------
  test-runner:
    build: docker
    container_name: test-runner
    depends_on:
      - selenium-hub
      - chrome-node
      - test-data
      - healenium
      - vault
      - vault-init
      - prometheus
      - grafana
    environment:
      # -------------------------------
      # ENV SELECTION
      # -------------------------------
      - ENV=dev

      # -------------------------------
      # EXECUTION
      # -------------------------------
      - SUITE=tests/testng.xml
      - DRIVER=selenium
      - BROWSER=chrome
      - HEADLESS=true
      - REMOTE=true
      - HEALING=true

      # -------------------------------
      # ENV-SPECIFIC BASE URLS
      # -------------------------------
      - BASEURL_DEV=https://dev.api.makemytrip.com
      - BASEURL_STAGE=https://stage.api.makemytrip.com
      - BASEURL_PILOT=https://pilot.api.makemytrip.com
      - BASEURL_PROD=https://api.makemytrip.com

      # -------------------------------
      # ENV-SPECIFIC TEST DATA URLS
      # -------------------------------
      - TESTDATA_URL_DEV=http://test-data:8081
      - TESTDATA_URL_STAGE=http://test-data:8081
      - TESTDATA_URL_PILOT=http://test-data:8081
      - TESTDATA_URL_PROD=http://test-data:8081

      # -------------------------------
      # ENV-SPECIFIC GRID URLS
      # -------------------------------
      - GRID_URL_DEV=http://selenium-hub:4444/wd/hub
      - GRID_URL_STAGE=http://selenium-hub:4444/wd/hub
      - GRID_URL_PILOT=http://selenium-hub:4444/wd/hub
      - GRID_URL_PROD=http://selenium-hub:4444/wd/hub

      # -------------------------------
      # ENV-SPECIFIC FEATURE FLAG URLS
      # -------------------------------
      - FEATURE_FLAG_URL_DEV=http://feature-flags:8090
      - FEATURE_FLAG_URL_STAGE=http://feature-flags:8090
      - FEATURE_FLAG_URL_PILOT=http://feature-flags:8090
      - FEATURE_FLAG_URL_PROD=http://feature-flags:8090

      # -------------------------------
      # ENV-SPECIFIC KAFKA URLS
      # -------------------------------
      - KAFKA_URL_DEV=dev-kafka:9092
      - KAFKA_URL_STAGE=stage-kafka:9092
      - KAFKA_URL_PILOT=pilot-kafka:9092
      - KAFKA_URL_PROD=prod-kafka:9092

      # -------------------------------
      # ENV-SPECIFIC DB URLS / USERS
      # -------------------------------
      - DB_URL_DEV=jdbc:mysql://dev-db:3306/test
      - DB_URL_STAGE=jdbc:mysql://stage-db:3306/test
      - DB_URL_PILOT=jdbc:mysql://pilot-db:3306/test
      - DB_URL_PROD=jdbc:mysql://prod-db:3306/test

      - DB_USER_DEV=root
      - DB_USER_STAGE=root
      - DB_USER_PILOT=root
      - DB_USER_PROD=root

      # -------------------------------
      # VAULT
      # -------------------------------
      - VAULT_ENABLED=true
      - VAULT_URL=http://vault:8200
      - VAULT_TOKEN=my-root-token
      - VAULT_APP_NAME=apiui

      # -------------------------------
      # JIRA
      # -------------------------------
      - JIRA_ENABLED=true
      - JIRA_URL=https://your-domain.atlassian.net
      - JIRA_PROJECT=QA

      # -------------------------------
      # METRICS
      # -------------------------------
      - METRICS_ENABLED=true
      - METRICS_PORT=9090

      # -------------------------------
      # RETRY / AI / OPTIONAL FLAGS
      # -------------------------------
      - RETRY_ENABLED=true
      - RETRY_COUNT=2
      - AI_ENABLED=false
      - USE_TIA=true

    volumes:
      - ./allure-results:/app/allure-results
      - ./allure-history:/app/allure-history