name: UI + API Automation CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # -------------------------------
      # Checkout code
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------
      # Setup Java
      # -------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # -------------------------------
      # Cache Maven dependencies
      # -------------------------------
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      # -------------------------------
      # Build test-data-service
      # -------------------------------
      - name: Build test-data-service
        run: |
          cd test-data-service
          mvn clean package -DskipTests
          cd ..

      # -------------------------------
      # Create Allure history folder
      # -------------------------------
      - name: Prepare Allure history
        run: mkdir -p allure-history

      # -------------------------------
      # Run Docker Compose
      # -------------------------------
      - name: Run tests via Docker
        run: |
          docker-compose -f docker-compose.yml -f docker-compose.ci.yml up --build --abort-on-container-exit

      # -------------------------------
      # Copy Allure history (persist)
      # -------------------------------
      - name: Save Allure history
        if: always()
        run: |
          if [ -d "allure-history" ]; then
            echo "History exists"
          fi

      # -------------------------------
      # Upload Allure results
      # -------------------------------
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # -------------------------------
      # Upload Allure Report
      # -------------------------------
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

      # -------------------------------
      # Fail job if tests failed
      # -------------------------------
      - name: Fail if tests failed
        if: failure()
        run: exit 1

      # -------------------------------
      # Detect changed files
      # -------------------------------
      - name: Detect changed files
        id: changes
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD > changed-files.txt
          cat changed-files.txt

